backend:
  name: git-gateway
  branch: main

publish_mode: simple
locale: es

# Las imágenes se guardan en la carpeta pública para conservar las rutas actuales.
media_folder: images
public_folder: images

collections:
  - name: productos
    label: Productos
    label_singular: Producto
    folder: data/productos
    create: true
    slug: '{{id}}'
    sortable_fields: ['id', 'name', 'category', 'price']
    fields:
      - { name: id, label: ID, widget: string, hint: 'Identificador único, por ejemplo pulseras-42' }
      - name: category
        label: Categoría
        widget: relation
        collection: categorias
        value_field: slug
        display_fields: [label_es, label_en]
        search_fields: [slug, label_es, label_en]
      - { name: subcategory_es, label: Subcategoría (ES), widget: string, required: false }
      - { name: subcategory_en, label: Subcategoría (EN), widget: string, required: false }
      - { name: name, label: Nombre (ES), widget: string }
      - { name: name_en, label: Nombre (EN), widget: string }
      - name: image
        label: Imagen principal
        widget: image
        media_folder: /images
        public_folder: images
      - name: gallery
        label: Fotos adicionales
        widget: list
        required: false
        field: { label: Foto, name: image, widget: image, media_folder: /images, public_folder: images }
      - { name: material_es, label: Material (ES), widget: string }
      - { name: material_en, label: Material (EN), widget: string }
      - { name: price, label: Precio, widget: number, value_type: int, min: 0 }
      - { name: weeks, label: Semanas de entrega, widget: number, value_type: int, min: 0 }
      - { name: dimensions_es, label: Dimensiones (ES), widget: string, required: false }
      - { name: dimensions_en, label: Dimensiones (EN), widget: string, required: false }
      - { name: isNew, label: Nuevo, widget: boolean, default: false }
      - { name: isLimited, label: Edición limitada, widget: boolean, default: false }

  - name: categorias
    label: Categorías
    label_singular: Categoría
    folder: data/categorias
    create: true
    slug: '{{slug}}'
    fields:
      - { name: slug, label: Slug, widget: string, hint: 'Identificador sin espacios, por ejemplo pulseras' }
      - { name: label_es, label: Nombre (ES), widget: string }
      - { name: label_en, label: Nombre (EN), widget: string }
      - { name: tagline_es, label: Descripción (ES), widget: text }
      - { name: tagline_en, label: Descripción (EN), widget: text }
      - name: banner
        label: Imagen de banner
        widget: image
        media_folder: /images
        public_folder: images
      - name: subcats_es
        label: Subcategorías (ES)
        widget: list
        required: false
      - name: subcats_en
        label: Subcategorías (EN)
        widget: list
        required: false
